name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo mv /tmp/age/age /usr/local/bin/age

      - name: Restore the signing keystore (age-decrypt, key = secret)
        env:
          KEYSTORE_AGE_KEY: ${{ secrets.KEYSTORE_AGE_KEY }}
        run: |
          printf '%s' "$KEYSTORE_AGE_KEY" > /tmp/nightly.key
          age -d -i /tmp/nightly.key keystore/hermes-live.keystore.age > keystore/hermes-live.keystore
          age -d -i /tmp/nightly.key keystore/keystore.properties.age > keystore/keystore.properties
          rm -f /tmp/nightly.key
          echo "keystore: $(wc -c < keystore/hermes-live.keystore) bytes"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish to the moving "latest" prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease --title "Build latest" \
                 --notes "APK de la branche main, mis à jour à chaque push."
          gh release upload latest "$APK" --repo "$GITHUB_REPOSITORY" --clobber
