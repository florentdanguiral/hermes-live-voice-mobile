name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo mv /tmp/age/age /usr/local/bin/age

      - name: Restore the signing keystore (age-decrypt, key = secret)
        env:
          KEYSTORE_AGE_KEY: ${{ secrets.KEYSTORE_AGE_KEY }}
        run: |
          printf '%s' "$KEYSTORE_AGE_KEY" > /tmp/nightly.key
          age -d -i /tmp/nightly.key keystore/hermes-live.keystore.age > keystore/hermes-live.keystore
          age -d -i /tmp/nightly.key keystore/keystore.properties.age > keystore/keystore.properties
          rm -f /tmp/nightly.key
          echo "keystore: $(wc -c < keystore/hermes-live.keystore) bytes"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish a versioned prerelease (Obtainium-friendly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          APK=app/build/outputs/apk/release/app-release.apk
          OUT="hermes-live-$VERSION.apk"
          cp "$APK" "$OUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "$OUT" --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "v$VERSION" \
              --notes "APK signé de la branche main. Installe par-dessus la version précédente."
          fi
          # Ne garde que les 4 releases versionnées les plus récentes.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName,publishedAt \
            -q 'sort_by(.publishedAt) | reverse | .[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n +5 |
            while read -r t; do
              gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
            done
